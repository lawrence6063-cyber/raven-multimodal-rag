[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular, observable RAG framework with MCP protocol support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "dashscope>=1.20.0",
    "langchain-text-splitters>=0.0.1",
    "markitdown[pdf]>=0.1.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]
# eval: 可选评估依赖。pytrec_eval 用于 IR 指标金标准交叉校验；beir 用于公开基准锚定；
# ragas 用于生成侧真跑（faithfulness/answer_relevancy 等）；sentence-transformers 用于
# cross-encoder 精排（阶段3 低延迟方案，本地推理）。核心 IR 指标仅依赖 numpy。
eval = [
    "pytrec_eval>=0.5",
    "beir>=2.0.0",
    "ragas>=0.1.0",
    "sentence-transformers>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use real services)",
    "e2e: End-to-end tests (full pipeline)",
]
pythonpath = ["."]
